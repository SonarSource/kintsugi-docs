site_name: Kintsugi
site_description: Agentic Development Environment for Claude Code
site_author: Sonar
site_url: https://sonarsource.github.io/kintsugi-docs

repo_name: SonarSource/kintsugi-docs
repo_url: https://github.com/SonarSource/kintsugi-docs
edit_uri: edit/master/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/book-open-variant
    repo: fontawesome/brands/github
  features:
    #- header.sticky
    # Navigation
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Table of Contents
    - toc.follow
    - toc.integrate
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true

markdown_extensions:
  # Admonitions
  - admonition
  - pymdownx.details
  # Superfences for code blocks and diagrams
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format:
            !!python/name:pymdownx.superfences.fence_code_format # Tabbed content


  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  # Emoji support
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator:
        !!python/name:material.extensions.emoji.to_svg # Task lists


  - pymdownx.tasklist:
      custom_checkbox: true
  # Tables
  - tables
  # Attributes and HTML
  - attr_list
  - md_in_html
  # Table of Contents
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3
  # Additional extensions for better formatting
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - def_list
  - footnotes
  - abbr

nav:
  - Home: index.md
  - Terms: terms.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SonarSource/kintsugi-docs
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/sonarsource
      name: Discord Community
  version:
    provider: mike
  status:
    new: Recently added
    deprecated: Deprecated
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2024 Kintsugi Team
